# GPU override for the shared Ollama (NVIDIA DGX Spark). Needs the NVIDIA container
# toolkit (preinstalled on DGX OS). Use:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
