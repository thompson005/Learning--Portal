# Self-host the Technieum portal + its Postgres on one host (e.g. a DGX Spark).
#   cp .env.docker.example .env   # then edit the secrets
#   docker compose up -d --build
#   docker compose exec app npx prisma db push      # create the tables (first run)
#   docker compose exec app npx prisma db seed       # seed the admin account
#
# The app starts each lab as its OWN container on the host Docker (via the
# mounted socket), publishing it on a host port in LABS_PORT_MIN..MAX. Open that
# range on the host firewall so learners can reach their lab target.

# Cap container logs so they can never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    # Never published on the host: only reachable by the app / migrate / db-backup on the compose network.
    shm_size: 256mb
    stop_grace_period: 60s   # let Postgres shut down cleanly (no crash recovery on restart)
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=off
    environment:
      POSTGRES_USER: technieum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: technieum
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technieum"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Small local LLM for the AI-Security labs (labs flagged `localModel`). Runs in Docker
  # on the same host; reachable only from the lab network below, NOT published on the
  # host. CPU by default; add docker-compose.gpu.yml for the DGX GPU:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *logging
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
    volumes:
      - ollamadata:/root/.ollama
    networks:
      labnet:
        aliases: [ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pulls the small models into the ollamadata volume, then exits.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      LAB_MODELS: ${LAB_MODELS:-qwen2.5:3b-instruct}
    entrypoint: ["/bin/sh", "-c", "for m in $$LAB_MODELS; do ollama pull $$m; done"]
    networks: [labnet]

  # One-shot: brings the schema up to date (Prisma Migrate) before the app starts.
  # Baselines a database that was created earlier with `db push`. Never drops data.
  migrate:
    build: &appbuild
      context: .
      args:
        NEXT_PUBLIC_LABS_DOCKER: "1"
    image: technieum-portal:local
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://technieum:${POSTGRES_PASSWORD:-change-me}@db:5432/technieum?schema=public
      DB_SYNC_LEGACY: ${DB_SYNC_LEGACY:-0}
    command: ["node", "scripts/db/migrate.mjs"]

  # Verified pg_dump every day (BACKUP_HOUR_UTC) + once at start. Rotation: 14 daily /
  # 8 weekly / 12 monthly into ./backups on the host. Healthy only if a backup is < 30h old.
  db-backup:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: technieum
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: technieum
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-02}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
    volumes:
      - ./backups:/backups
      - ./scripts/db/backup-loop.sh:/scripts/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    healthcheck:
      test: ["CMD-SHELL", "find /backups/daily -name '*.dump' -mmin -1800 | grep -q ."]
      interval: 15m
      timeout: 10s
      retries: 1
      start_period: 10m

  app:
    build: *appbuild
    image: technieum-portal:local
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://technieum:${POSTGRES_PASSWORD:-change-me}@db:5432/technieum?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-change-me}
      # AI features (tutor chat, Explain-simpler, Teki) use the LOCAL model on the
      # DGX only — an OpenAI-compatible server (vLLM). No cloud provider.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://10.8.0.11:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # This self-host serves over plain HTTP, so cookies must NOT be marked
      # Secure (browsers drop Secure cookies on HTTP and login fails). Set to 0
      # only once you put HTTPS/TLS in front.
      INSECURE_COOKIES: ${INSECURE_COOKIES:-1}
      # Lab scheduling / resource limits — size these to the host.
      LABS_MAX_CONCURRENT: ${LABS_MAX_CONCURRENT:-24}
      LABS_MEM: ${LABS_MEM:-512m}
      LABS_CPUS: ${LABS_CPUS:-1}
      LABS_PIDS: ${LABS_PIDS:-256}
      LABS_PORT_MIN: ${LABS_PORT_MIN:-18100}
      LABS_PORT_MAX: ${LABS_PORT_MAX:-18160}
      # Bind lab target ports to this host IP only (set to the DGX VPN IP so
      # vulnerable targets are reachable only over the VPN).
      LABS_BIND_IP: ${BIND_IP:-}
      # Labs flagged `localModel` join this network to reach the shared Ollama.
      LABS_NETWORK: technieum-labnet
      LABS_MODEL: ${LABS_MODEL:-qwen2.5:3b-instruct}
    ports:
      # BIND_IP restricts the portal to one interface (the VPN IP). Unset = all.
      # WEB_PORT is the host port — set to 80 so users type a bare hostname with
      # no :port (e.g. http://lms.technieum.net).
      - "${BIND_IP:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    # default = db access; labnet = so the app can health-check the shared Ollama.
    networks: [default, labnet]
    volumes:
      # Lets the app create/stop lab containers on the host. The lab containers
      # publish their own host ports directly, so the app only needs 3000.
      - /var/run/docker.sock:/var/run/docker.sock


networks:
  # Holds ONLY ollama + the lab containers that need a model — never the db or app.
  labnet:
    name: technieum-labnet

volumes:
  pgdata:
  ollamadata:
